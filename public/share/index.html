<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자산배분 헬퍼 - 포트폴리오 공유</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f7fa;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #666; font-size: 14px; margin: 0 0 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      background: #1976D2;
      color: white;
      border-radius: 8px;
      padding: 12px 24px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      margin: 6px;
    }
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    .code {
      background: #EFF6FF;
      border-radius: 8px;
      padding: 8px 16px;
      font-family: monospace;
      font-size: 22px;
      letter-spacing: 4px;
      font-weight: bold;
      color: #1976D2;
      margin-bottom: 24px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📊</div>
    <h1>포트폴리오가 공유되었습니다</h1>
    <p>자산배분 헬퍼 앱에서 확인하세요</p>
    <div class="code" id="code-display">------</div>
    <br>
    <a class="btn" id="open-app" href="#">앱에서 열기</a>
    <br>
    <a class="btn btn-secondary" id="store-link"
       href="https://play.google.com/store/apps/details?id=com.dobby.assetallocation">
      앱 설치하기
    </a>
  </div>

  <script>
    const parts = window.location.pathname.split('/').filter(Boolean);
    const code = (parts[parts.length - 1] || '').toUpperCase();

    if (code && code !== 'SHARE' && code !== 'INDEX.HTML') {
      document.getElementById('code-display').textContent = code;

      // Android intent URL: opens app if installed, fallbacks to Play Store
      const fallback = encodeURIComponent(
        'https://play.google.com/store/apps/details?id=com.dobby.assetallocation'
      );
      const intentUrl =
        'intent://shared/' + code +
        '#Intent;scheme=assetallocation;package=com.dobby.assetallocation;' +
        'S.browser_fallback_url=' + fallback + ';end';

      document.getElementById('open-app').href = intentUrl;

      // Auto-redirect after short delay
      setTimeout(function() {
        window.location.href = intentUrl;
      }, 1500);
    }
  </script>
</body>
</html>
